<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - Captain In One Heart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-global.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div id="topbar-container" data-title="Quản lý sản phẩm"></div>

        <div class="card-figma">
            <h3 class="card-title" id="form-title">Thêm sản phẩm mới</h3>
            <div class="form-grid-figma" style="grid-template-columns: 200px 1fr 1px 1fr;">
                <!-- Image Upload Section -->
                <div class="form-image-section">
                    <div class="image-preview" id="imagePreview" onclick="document.getElementById('p-image-input').click()">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Tải ảnh bìa</p>
                    </div>
                    <input type="file" id="p-image-input" hidden accept="image/*" onchange="previewImage(this)">
                    <button class="btn-figma btn-figma-outline" style="width: 100%; margin-top: 10px; font-size: 12px;" onclick="document.getElementById('p-image-input').click()">Chọn tệp ảnh</button>
                </div>

                <div class="form-left">
                    <div class="form-group-figma"><label>Tên sản phẩm</label><input type="text" class="form-control-figma" id="p-name" placeholder="Nhập tên sách..."></div>
                    <div class="form-group-figma"><label>Nhà xuất bản</label><input type="text" class="form-control-figma" id="p-nxb" placeholder="Tên NXB..."></div>
                    <div class="form-group-figma"><label>Tác giả</label><input type="text" class="form-control-figma" id="p-author" placeholder="Tên tác giả..."></div>
                    <div class="form-group-figma">
                        <label>Thể loại</label>
                        <select id="p-category" class="form-control-figma">
                            <!-- Categories will be loaded here -->
                        </select>
                    </div>
                </div>
                <div class="form-divider"></div>
                <div class="form-right">
                    <div class="form-group-figma"><label>Ngày xuất bản</label><input type="date" class="form-control-figma" id="p-date"></div>
                    <div class="form-group-figma"><label>Giá bán (VNĐ)</label><input type="number" class="form-control-figma" id="p-price" placeholder="Ví dụ: 150000"></div>
                    <div class="form-group-figma"><label>Số lượng kho</label><input type="number" class="form-control-figma" id="p-stock" placeholder="0"></div>
                    <div class="form-group-figma"><label>Mã ISBN</label><input type="text" class="form-control-figma" id="p-isbn" placeholder="Mã định danh sách..."></div>
                </div>
            </div>
            <div class="btn-group-figma">
                <button class="btn-figma btn-figma-outline" onclick="resetForm()">Làm mới</button>
                <button class="btn-figma btn-figma-primary" id="btn-submit" onclick="handleSubmit()">Lưu sản phẩm</button>
            </div>
        </div>

        <div class="card-figma">
            <h3 class="card-title">Danh sách sản phẩm hiện có</h3>
            <table class="table-figma">
                <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Thể loại</th>
                        <th>Tác giả</th>
                        <th>Giá bán</th>
                        <th>Kho</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="product-table-body">
                </tbody>
            </table>
            <div id="empty-box" class="empty-chart" style="display: none;">
                <i class="fa-regular fa-face-frown"></i>
                <p>Không có dữ liệu</p>
            </div>
        </div>
    </main>

    <script>
    const API_URL = 'http://localhost:5000/api/products';
    const UPLOAD_URL = 'http://localhost:5000/api/upload';
    let currentEditId = null;
    let currentImageUrl = '';

    // Load categories for select
    async function loadCategories() {
        try {
            const res = await fetch(`${API_URL}/categories`);
            const data = await res.json();
            const select = document.getElementById('p-category');
            select.innerHTML = data.map(c => `<option value="${c.name}">${c.name}</option>`).join('');
        } catch (err) { console.error(err); }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function loadProducts() {
        try {
            const res = await fetch(`${API_URL}/all`);
            const data = await res.json();
            if (data.success) {
                renderProducts(data.products);
            }
        } catch (err) { console.error("Lỗi:", err); }
    }

    async function handleSubmit() {
        const fileInput = document.getElementById('p-image-input');
        let imageUrl = currentImageUrl;

        // 1. Upload image if new file selected
        if (fileInput.files.length > 0) {
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            try {
                const uploadRes = await fetch(UPLOAD_URL, { method: 'POST', body: formData });
                const uploadData = await uploadRes.json();
                if (uploadData.success) imageUrl = uploadData.imageUrl;
            } catch (err) { console.error(err); }
        }

        const productData = {
            name: document.getElementById('p-name').value,
            nxb: document.getElementById('p-nxb').value,
            author: document.getElementById('p-author').value,
            category: document.getElementById('p-category').value,
            publishDate: document.getElementById('p-date').value,
            price: Number(document.getElementById('p-price').value),
            stock: Number(document.getElementById('p-stock').value),
            isbn: document.getElementById('p-isbn').value,
            imageUrl: imageUrl
        };

        if(!productData.name) return alert("Vui lòng nhập tên sản phẩm!");

        const method = currentEditId ? 'PUT' : 'POST';
        const url = currentEditId ? `${API_URL}/update/${currentEditId}` : `${API_URL}/add`;

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });
            const result = await res.json();
            if(result.success) {
                alert(currentEditId ? "Cập nhật thành công!" : "Thêm thành công!");
                resetForm();
                loadProducts();
            }
        } catch (err) { console.error(err); }
    }

    async function editProduct(id) {
        try {
            const res = await fetch(`${API_URL}/${id}`);
            const p = await res.json();
            
            currentEditId = id;
            currentImageUrl = p.imageUrl;
            
            document.getElementById('form-title').innerText = "Chỉnh sửa sản phẩm";
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-nxb').value = p.publisherName || p.nxb || '';
            document.getElementById('p-author').value = p.authorName || p.author || '';
            document.getElementById('p-category').value = p.categoryName || p.category || '';
            document.getElementById('p-date').value = p.publishDate ? p.publishDate.split('T')[0] : '';
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-stock').value = p.stock;
            document.getElementById('p-isbn').value = p.isbn || '';
            
            document.getElementById('imagePreview').innerHTML = `<img src="${p.imageUrl || 'https://via.placeholder.com/200x250'}" alt="Preview">`;
            document.getElementById('btn-submit').innerText = "Cập nhật sản phẩm";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) { console.error(err); }
    }

    async function deleteProduct(id) {
        if(!confirm("Xác nhận xóa sản phẩm này?")) return;
        try {
            const res = await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
            if(res.ok) loadProducts();
        } catch (err) { console.error(err); }
    }

    // Search Handler for Global Search Input
    window.handleSearch = async function(query) {
        if(!query) return loadProducts();
        try {
            const res = await fetch(`${API_URL}/search?q=${query}`);
            const data = await res.json();
            // Reuse loadProducts logic with filtered data
            renderProducts(data.products); 
        } catch (err) { console.error(err); }
    };

    function renderProducts(products) {
        const tableBody = document.getElementById('product-table-body');
        const emptyBox = document.getElementById('empty-box');
        if (products.length > 0) {
            emptyBox.style.display = 'none';
            tableBody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.imageUrl || 'https://via.placeholder.com/40x60'}" style="width: 40px; height: 60px; object-fit: cover; border-radius: 5px;"></td>
                    <td style="font-weight: 700; color: var(--text-main);">${p.name || p.productName}</td>
                    <td>${p.categoryName || p.category || '---'}</td>
                    <td>${p.authorName || p.author || '---'}</td>
                    <td style="color: var(--active-red); font-weight: 700;">${Number(p.price).toLocaleString()}đ</td>
                    <td>${p.sold || 0}</td>
                    <td style="text-align: right;">
                        <button onclick="editProduct('${p._id || p.id}')" class="btn-figma btn-figma-outline" style="padding: 5px 10px; color: #4A90E2; border-color: #e2f0ff; margin-right: 5px;">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteProduct('${p._id || p.id}')" class="btn-figma btn-figma-outline" style="padding: 5px 10px; color: var(--active-red); border-color: #ffe4e4;">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        } else {
            emptyBox.style.display = 'flex';
            tableBody.innerHTML = '';
        }
    }

    function resetForm() {
        currentEditId = null;
        currentImageUrl = '';
        document.getElementById('form-title').innerText = "Thêm sản phẩm mới";
        document.querySelectorAll('input, select').forEach(i => i.value = '');
        document.getElementById('imagePreview').innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i><p>Tải ảnh bìa</p>`;
        document.getElementById('btn-submit').innerText = "Lưu sản phẩm";
    }
    
    window.onload = () => {
        loadCategories();
        loadProducts();
    };
    </script>
    <script src="js/admin-layout.js"></script>
</body>
</html>
