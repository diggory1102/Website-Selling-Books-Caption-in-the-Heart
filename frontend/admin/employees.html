<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhân viên - Captain In One Heart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-global.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div id="topbar-container" data-title="Quản lý nhân viên"></div>

        <div class="card-figma" style="display: flex; gap: 30px;">
            <div class="avatar-placeholder" id="avatarPreview" onclick="document.getElementById('emp-avatar-input').click()" style="width: 150px; height: 150px; background: #f3f4f6; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 50px; color: #9ca3af; border: 1px dashed var(--border-color); cursor: pointer; overflow: hidden;">
                <i class="fa-regular fa-user"></i>
            </div>
            <input type="file" id="emp-avatar-input" hidden accept="image/*" onchange="previewAvatar(this)">
            
            <div style="flex: 1;">
                <h3 class="card-title">Thiết lập thông tin nhân viên</h3>
                <div class="form-grid-figma" style="grid-template-columns: 1fr 1fr; border: none;">
                    <div class="form-group-figma"><label>Tên nhân viên</label><input type="text" id="emp-name" class="form-control-figma" placeholder="Họ và tên..."></div>
                    <div class="form-group-figma"><label>Giới tính</label><input type="text" id="emp-gender" class="form-control-figma" placeholder="Nam/Nữ..."></div>
                    <div class="form-group-figma"><label>Mã nhân viên</label><input type="text" id="emp-code" class="form-control-figma" placeholder="NV-001..."></div>
                    <div class="form-group-figma"><label>CCCD</label><input type="text" id="emp-cccd" class="form-control-figma" placeholder="Số định danh..."></div>
                    <div class="form-group-figma"><label>Ngày sinh</label><input type="date" id="emp-dob" class="form-control-figma"></div>
                    <div class="form-group-figma"><label>Tài khoản</label><input type="text" id="emp-username" class="form-control-figma" placeholder="Tên đăng nhập..."></div>
                    <div class="form-group-figma"><label>Số điện thoại</label><input type="text" id="emp-phone" class="form-control-figma" placeholder="0xxx..."></div>
                    <div class="form-group-figma"><label>Mật khẩu</label><input type="password" id="emp-password" class="form-control-figma" placeholder="********"></div>
                    <div class="form-group-figma"><label>Email</label><input type="email" id="emp-email" class="form-control-figma" placeholder="example@gmail.com"></div>
                    <div class="form-group-figma">
                        <label>Chức vụ</label>
                        <select id="emp-role" class="form-control-figma">
                            <option value="staff">Nhân viên (Staff)</option>
                            <option value="admin">Quản trị viên (Admin)</option>
                        </select>
                    </div>
                </div>
                <div class="btn-group-figma">
                    <button class="btn-figma btn-figma-outline" onclick="resetForm()">Làm mới</button>
                    <button class="btn-figma btn-figma-primary" onclick="saveEmployee()">Lưu nhân viên</button>
                </div>
            </div>
        </div>

        <div class="card-figma">
            <h3 class="card-title">Danh sách nhân viên</h3>
            <table class="table-figma">
                <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Mã NV</th>
                        <th>Tên nhân viên</th>
                        <th>Tài khoản</th>
                        <th>Chức vụ</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="employee-list">
                    <!-- Data here -->
                </tbody>
            </table>
            <div id="empty-box" class="empty-chart" style="display: none;">
                <i class="fa-regular fa-face-frown"></i>
                <p>Không có dữ liệu nhân viên</p>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api/employees';
        const UPLOAD_URL = 'http://localhost:5000/api/upload';

        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function loadEmployees() {
            try {
                const res = await fetch(`${API_URL}/all`);
                const data = await res.json();
                const tableBody = document.getElementById('employee-list');
                const emptyBox = document.getElementById('empty-box');

                if (data.success && data.employees.length > 0) {
                    emptyBox.style.display = 'none';
                    tableBody.innerHTML = data.employees.map(emp => `
                        <tr>
                            <td><img src="${emp.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + emp.userName}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border:1px solid #eee;"></td>
                            <td>${emp.cccd || '---'}</td>
                            <td style="font-weight:700; color: var(--text-main);">${emp.fullName || 'Chưa đặt tên'}</td>
                            <td>@${emp.userName}</td>
                            <td><span class="badge-status ${emp.roleId?.name === 'admin' ? 'completed' : 'shipping'}" style="text-transform: capitalize;">${emp.roleId?.name || 'staff'}</span></td>
                            <td style="text-align: right;">
                                <button onclick="deleteEmployee('${emp._id}', '${emp.userName}')" class="btn-figma btn-figma-outline" style="padding: 5px 10px; color: var(--active-red); border-color: #ffe4e4;">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    emptyBox.style.display = 'flex';
                    tableBody.innerHTML = '';
                }
            } catch (err) { console.error("Lỗi:", err); }
        }

        async function saveEmployee() {
            const fileInput = document.getElementById('emp-avatar-input');
            let avatarUrl = '';

            // 1. Upload ảnh trước nếu có chọn
            if (fileInput.files.length > 0) {
                const formData = new FormData();
                formData.append('image', fileInput.files[0]);
                try {
                    const uploadRes = await fetch(UPLOAD_URL, { method: 'POST', body: formData });
                    const uploadData = await uploadRes.json();
                    if (uploadData.success) avatarUrl = uploadData.imageUrl;
                } catch (err) { console.error("Lỗi upload:", err); }
            }

            const empData = {
                fullName: document.getElementById('emp-name').value,
                userName: document.getElementById('emp-username').value,
                password: document.getElementById('emp-password').value,
                email: document.getElementById('emp-email').value,
                phone: document.getElementById('emp-phone').value,
                roleName: document.getElementById('emp-role').value,
                gender: document.getElementById('emp-gender').value,
                dob: document.getElementById('emp-dob').value,
                cccd: document.getElementById('emp-code').value, // dùng cccd làm mã nhân viên
                avatar: avatarUrl
            };
            
            if(!empData.userName || !empData.password) return alert("Vui lòng nhập Tài khoản và Mật khẩu!");
            if(!empData.dob) return alert("Vui lòng nhập Ngày sinh!");
            
            const dobDate = new Date(empData.dob);
            const today = new Date();
            let age = today.getFullYear() - dobDate.getFullYear();
            const m = today.getMonth() - dobDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dobDate.getDate())) {
                age--;
            }
            if (age < 18) return alert("Nhân viên phải từ 18 tuổi trở lên!");
            if (dobDate > today) return alert("Ngày sinh không thể ở tương lai!");

            try {
                const res = await fetch(`${API_URL}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(empData)
                });
                const result = await res.json();
                if(result.success) {
                    alert("Thêm nhân viên thành công!");
                    resetForm();
                    loadEmployees();
                } else {
                    alert("Lỗi: " + result.message);
                }
            } catch (err) { console.error(err); }
        }

        async function deleteEmployee(id, userName) {
            if(!confirm(`Xác nhận xóa nhân viên ${userName}?`)) return;
            try {
                const res = await fetch(`${API_URL}/delete/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if(result.success) {
                    loadEmployees();
                } else {
                    alert(result.message);
                }
            } catch (err) { console.error(err); }
        }

        function resetForm() {
            document.querySelectorAll('input, select').forEach(i => i.value = '');
            document.getElementById('avatarPreview').innerHTML = `<i class="fa-regular fa-user"></i>`;
            initDobLimit();
        }

        function initDobLimit() {
            const today = new Date();
            const maxYear = today.getFullYear() - 18;
            const maxMonth = String(today.getMonth() + 1).padStart(2, '0');
            const maxDay = String(today.getDate()).padStart(2, '0');
            document.getElementById('emp-dob').max = `${maxYear}-${maxMonth}-${maxDay}`;
        }

        window.onload = () => {
            loadEmployees();
            initDobLimit();
        };
    </script>
    <script src="js/admin-layout.js"></script>
</body>
</html>
