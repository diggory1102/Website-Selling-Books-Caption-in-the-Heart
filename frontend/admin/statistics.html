<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê - Captain In One Heart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-global.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stats-grid-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
        }
        .stat-mini-card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mini-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div id="topbar-container" data-title="Phân tích dữ liệu"></div>

        <div class="stats-grid-row">
            <div class="stat-mini-card">
                <div class="mini-icon" style="background: #eef2ff; color: #4338ca;"><i class="fa-solid fa-sack-dollar"></i></div>
                <div>
                    <p style="font-size: 13px; color: var(--text-light); font-weight: 600;">Doanh thu</p>
                    <h3 id="sumRevenue" style="font-size: 18px; margin-top: 5px;">0 đ</h3>
                </div>
            </div>
            <div class="stat-mini-card">
                <div class="mini-icon" style="background: #f0fdf4; color: #16a34a;"><i class="fa-solid fa-cart-shopping"></i></div>
                <div>
                    <p style="font-size: 13px; color: var(--text-light); font-weight: 600;">Đơn hàng</p>
                    <h3 id="sumOrders" style="font-size: 18px; margin-top: 5px;">0</h3>
                </div>
            </div>
            <div class="stat-mini-card">
                <div class="mini-icon" style="background: #fff7ed; color: #ea580c;"><i class="fa-solid fa-book"></i></div>
                <div>
                    <p style="font-size: 13px; color: var(--text-light); font-weight: 600;">Sản phẩm</p>
                    <h3 id="sumProducts" style="font-size: 18px; margin-top: 5px;">0</h3>
                </div>
            </div>
            <div class="stat-mini-card">
                <div class="mini-icon" style="background: #fafafa; color: #171717;"><i class="fa-solid fa-users"></i></div>
                <div>
                    <p style="font-size: 13px; color: var(--text-light); font-weight: 600;">Khách hàng</p>
                    <h3 id="sumUsers" style="font-size: 18px; margin-top: 5px;">0</h3>
                </div>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-container">
                <h3 class="card-title">Biểu đồ doanh thu (7 ngày gần nhất)</h3>
                <canvas id="revenueChart" height="150"></canvas>
            </div>
            <div class="chart-container">
                <h3 class="card-title">Tỷ lệ trạng thái đơn</h3>
                <canvas id="statusChart"></canvas>
            </div>
        </div>
    </main>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('http://localhost:5000/api/stats/dashboard');
                const data = await res.json();
                
                if(data.success) {
                    // Update Summary
                    document.getElementById('sumRevenue').innerText = Number(data.summary.totalRevenue).toLocaleString() + ' đ';
                    document.getElementById('sumOrders').innerText = data.summary.totalOrders;
                    document.getElementById('sumProducts').innerText = data.summary.totalProducts;
                    document.getElementById('sumUsers').innerText = data.summary.totalUsers;

                    // Render Revenue Chart
                    const revCtx = document.getElementById('revenueChart').getContext('2d');
                    new Chart(revCtx, {
                        type: 'line',
                        data: {
                            labels: data.revenueChart.map(i => i.date),
                            datasets: [{
                                label: 'Doanh thu',
                                data: data.revenueChart.map(i => i.revenue),
                                borderColor: '#000',
                                backgroundColor: 'rgba(0,0,0,0.05)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            plugins: { legend: { display: false } },
                            scales: { y: { beginAtZero: true } }
                        }
                    });

                    // Render Status Chart
                    const statusCtx = document.getElementById('statusChart').getContext('2d');
                    new Chart(statusCtx, {
                        type: 'doughnut',
                        data: {
                            labels: Object.keys(data.statusDistribution),
                            datasets: [{
                                data: Object.values(data.statusDistribution),
                                backgroundColor: ['#ea580c', '#2563eb', '#16a34a', '#dc2626']
                            }]
                        },
                        options: {
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }
            } catch (err) { console.error(err); }
        }

        window.onload = fetchStats;
    </script>
    <script src="js/admin-layout.js"></script>
</body>
</html>
