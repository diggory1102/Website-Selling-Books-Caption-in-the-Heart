<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách hàng - Captain In One Heart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-global.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div id="topbar-container" data-title="Quản lý khách hàng"></div>

        <div class="card-figma">
            <h3 class="card-title">Thông tin chi tiết khách hàng</h3>
            <div class="results-grid" id="selected-customer-box" style="display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px;">
                <div class="result-col">
                    <p>Tên khách hàng</p>
                    <h3 id="view-name">---</h3>
                </div>
                <div class="result-col">
                    <p>Tài khoản</p>
                    <h3 id="view-username">---</h3>
                </div>
                <div class="result-col">
                    <p>Hạng thành viên</p>
                    <h3 id="view-tier">---</h3>
                </div>
                <div class="result-col">
                    <p>Tổng chi tiêu</p>
                    <h3 id="view-spent" style="color: var(--active-red); font-weight: bold;">---</h3>
                </div>
                <div class="result-col">
                    <p>Trạng thái</p>
                    <h3 id="view-status">---</h3>
                </div>
                <div class="result-col">
                    <p>Thao tác</p>
                    <button id="btn-block" class="btn-figma btn-figma-danger" style="margin-top: 5px; padding: 5px 20px; width: 100%;" disabled onclick="toggleBlock()">Chặn tài khoản</button>
                </div>
            </div>
        </div>

        <div class="card-figma">
            <h3 class="card-title">Danh sách khách hàng</h3>
            <table class="table-figma">
                <thead>
                    <tr>
                        <th>Ảnh</th>
                        <th>Tài khoản</th>
                        <th>Họ tên</th>
                        <th>Điện thoại</th>
                        <th>Hạng thành viên</th>
                        <th>Tổng chi tiêu</th>
                        <th>Trạng thái</th>
                        <th style="text-align: right;">Hành động</th>
                    </tr>
                </thead>
                <tbody id="customer-table-body">
                </tbody>
            </table>

            <div id="empty-box" class="empty-chart" style="display: none;">
                <i class="fa-regular fa-face-frown"></i>
                <p>Chưa có dữ liệu khách hàng</p>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'http://localhost:5000/api/users/admin';
        let allUsers = [];
        let selectedUserId = null;

        async function init() {
            try {
                const res = await fetch(`${API_URL}/all`);
                const data = await res.json();
                if(data.success) {
                    allUsers = data.users;
                    renderUsers(allUsers);
                }
            } catch (err) { console.error(err); }
        }

        function getTierBadgeHtml(tier) {
            let bgColor = '#f1f5f9';
            let textColor = '#64748b';
            let icon = 'fa-solid fa-user';
            
            if (tier === 'Kim Cương') {
                bgColor = '#e0f7fa';
                textColor = '#006064';
                icon = 'fa-solid fa-gem';
            } else if (tier === 'Vàng') {
                bgColor = '#fff8e1';
                textColor = '#b78103';
                icon = 'fa-solid fa-crown';
            } else if (tier === 'Bạc') {
                bgColor = '#f5f7fa';
                textColor = '#475569';
                icon = 'fa-solid fa-medal';
            } else if (tier === 'Đồng') {
                bgColor = '#fbe9e7';
                textColor = '#a83c16';
                icon = 'fa-solid fa-award';
            }
            
            return `<span style="background: ${bgColor}; color: ${textColor}; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: inline-flex; align-items: center; gap: 5px;"><i class="${icon}"></i> ${tier}</span>`;
        }

        function renderUsers(users) {
            const tableBody = document.getElementById('customer-table-body');
            const emptyBox = document.getElementById('empty-box');

            if(users.length === 0) {
                emptyBox.style.display = 'flex';
                tableBody.innerHTML = '';
                return;
            }

            emptyBox.style.display = 'none';
            tableBody.innerHTML = users.map((u, index) => `
                <tr>
                    <td><img src="${u.avatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + u.userName}" style="width:35px; height:35px; border-radius:50%; object-fit:cover;"></td>
                    <td>@${u.userName}</td>
                    <td style="font-weight: 700; color: var(--text-main);">${u.fullName || '---'}</td>
                    <td>${u.numberPhone || '---'}</td>
                    <td>${getTierBadgeHtml(u.tier || 'Thành viên Mới')}</td>
                    <td style="font-weight: bold; color: var(--text-main);">${Number(u.totalSpent || 0).toLocaleString()} đ</td>
                    <td><span class="badge-status ${u.status === 'active' ? 'completed' : 'cancelled'}">${u.status === 'active' ? 'Hoạt động' : 'Đã chặn'}</span></td>
                    <td style="text-align: right;">
                        <button class="btn-figma btn-figma-outline" style="padding: 5px 15px; font-size: 12px;" onclick="viewDetail('${u._id}')">Chi tiết</button>
                    </td>
                </tr>
            `).join('');
        }

        function viewDetail(id) {
            const user = allUsers.find(u => u._id === id);
            if(user) {
                selectedUserId = id;
                document.getElementById('view-name').innerText = user.fullName || 'Chưa đặt tên';
                document.getElementById('view-username').innerText = '@' + user.userName;
                document.getElementById('view-tier').innerHTML = getTierBadgeHtml(user.tier || 'Thành viên Mới');
                document.getElementById('view-spent').innerText = Number(user.totalSpent || 0).toLocaleString() + ' đ';
                document.getElementById('view-status').innerText = user.status === 'active' ? 'Đang hoạt động' : 'Đã bị chặn';
                
                const btnBlock = document.getElementById('btn-block');
                btnBlock.disabled = false;
                btnBlock.innerText = user.status === 'active' ? 'Chặn tài khoản' : 'Bỏ chặn';
                btnBlock.className = user.status === 'active' ? 'btn-figma btn-figma-danger' : 'btn-figma btn-figma-primary';
            }
        }

        async function toggleBlock() {
            if(!selectedUserId) return;
            const user = allUsers.find(u => u._id === selectedUserId);
            const action = user.status === 'active' ? 'chặn' : 'bỏ chặn';
            
            if(!confirm(`Bạn có chắc chắn muốn ${action} tài khoản này?`)) return;

            try {
                const res = await fetch(`${API_URL}/toggle-status/${selectedUserId}`, { method: 'PUT' });
                const result = await res.json();
                if(result.success) {
                    alert(result.message);
                    init(); 
                    selectedUserId = null;
                    document.getElementById('view-name').innerText = '---';
                    document.getElementById('view-username').innerText = '---';
                    document.getElementById('view-tier').innerText = '---';
                    document.getElementById('view-spent').innerText = '---';
                    document.getElementById('view-status').innerText = '---';
                    document.getElementById('btn-block').disabled = true;
                }
            } catch (err) { console.error(err); }
        }

        window.handleSearch = function(query) {
            if(!query) return renderUsers(allUsers);
            const filtered = allUsers.filter(u => 
                (u.fullName && u.fullName.toLowerCase().includes(query.toLowerCase())) ||
                (u.userName && u.userName.toLowerCase().includes(query.toLowerCase())) ||
                (u.numberPhone && u.numberPhone.includes(query))
            );
            renderUsers(filtered);
        };

        window.onload = init;
    </script>
    <script src="js/admin-layout.js"></script>
</body>
</html>
