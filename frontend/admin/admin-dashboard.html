<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Caption In The Heart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-global.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="sidebar-container"></div>

    <main class="admin-main">
        <div id="topbar-container" data-title="Tổng quan"></div>

        <div class="dashboard-content">
            
            <div class="card-figma">
                <h3 class="card-title">Kết quả kinh doanh trong ngày</h3>
                <div class="results-grid">
                    <div class="result-col">
                        <p>Doanh thu</p>
                        <h3 id="statRevenue">0 đ</h3>
                    </div>
                    <div class="result-col">
                        <p>Đơn mới</p>
                        <h3 id="statOrders">0 đơn</h3>
                    </div>
                    <div class="result-col">
                        <p>Tổng khách hàng</p>
                        <h3 id="statUsers">0 người</h3>
                    </div>
                </div>
            </div>

            <div class="card-figma">
                <div class="card-tabs-header">
                    <div class="tabs-left">
                        <div class="tab-item active" id="tab-revenue" onclick="switchTab('revenue')">Doanh thu</div>
                        <div class="tab-separator"></div>
                        <div class="tab-item" id="tab-distribution" onclick="switchTab('distribution')">Tỷ trọng</div>
                    </div>
                    <div class="tabs-right">Trong 7 ngày qua</div>
                </div>
                
                <div id="chart-container" style="height: 350px; width: 100%; padding: 20px;">
                    <canvas id="dashboardChart"></canvas>
                </div>

                <div id="empty-chart" class="empty-chart" style="display: none;">
                    <i class="fa-regular fa-face-frown"></i>
                    <p>Không có dữ liệu</p>
                </div>
            </div>

        </div>
    </main>

    <script src="js/admin-layout.js"></script>
    <script src="js/admin-dashboard.js"></script>
</body>
</html>
